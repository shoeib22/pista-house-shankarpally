name: pista_ui
description: Shared Pista House brand components and theme.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
flutter:
  fonts:
    - family: HouseSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: HouseSerif
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
  assets:
    - assets/logo.svg
    - assets/biryani-cover.png
    - assets/charminar-heritage.png
    - assets/home-reference.png
