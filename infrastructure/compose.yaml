services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pista
      POSTGRES_DB: pista
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password in infrastructure/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U pista -d pista"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
